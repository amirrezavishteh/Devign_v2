[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devign"
version = "0.1.0"
description = "From-scratch PyTorch reproduction of Devign (Zhou et al., NeurIPS 2019)"
requires-python = ">=3.10"

# Bounds below were RE-DERIVED from the environment the test suite actually passes on
# (see requirements.lock.txt). The previous requirements.txt caps were stale and the working
# install violated six of them -- notably `tree-sitter<0.24.0` against an installed 0.25.2, while
# devign_data/parser.py's own docstring names 0.25.2 + 0.24.2 as the verified pair. Upper bounds
# are the next major/minor known to break API, not aspiration.
dependencies = [
    # Install torch FIRST from the PyTorch index; see README section 2.
    "torch>=2.1.0,<2.6.0",
    "numpy>=1.24.0,<2.0.0",
    "gensim>=4.3.3,<4.5.0",
    "scipy>=1.10.0,<1.16.0",

    # The code uses the tree-sitter 0.22+ API (Language(capsule), Parser(lang), node.has_error).
    # The floor is 0.23 for a stricter reason than API surface: recent tree-sitter-c ships grammar
    # ABI 15, which only a >=0.23 runtime can load. A 0.22 runtime paired with an ABI-15 grammar
    # fails at import with "Incompatible Language version 15".
    #
    # The exact pair matters beyond loadability: node TYPES are half of every node feature, so a
    # grammar bump silently changes the type vocabulary and therefore the model. That is pinned
    # behaviourally by tests/test_grammar_canary.py, which hashes the grammar's output over a
    # fixed canary function -- a stricter guard than a commit SHA, and one the PyPI wheel can
    # actually support.
    "tree-sitter>=0.23.0,<0.27.0",
    "tree-sitter-c>=0.21.0,<0.25.0",

    "scikit-learn>=1.3.0,<1.7.0",
    "xgboost>=2.0.0,<4.0.0",
    "scikit-optimize>=0.9.0,<0.11.0",
    "PyYAML>=6.0,<7.0",
    "pandas>=2.0.0,<2.3.0",

    # Real dataset download (the Devign authors' released FFmpeg+QEMU data).
    "huggingface_hub>=0.20.0,<2.0.0",
    "pyarrow>=14.0.0",

    # Table 3 static-analyzer comparison. Pure-Python, installs on Windows; cppcheck is a separate
    # native binary (see README) looked up on PATH / evaluation.static_analyzer_paths.
    "flawfinder>=2.0.19,<2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["devign_data", "models", "training", "scripts", "evaluation", "inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the run deterministic and quiet about a dependency's own deprecation noise.
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
]
