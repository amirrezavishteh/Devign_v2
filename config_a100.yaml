# A100 overrides. Inherits everything else from config.yaml -- keep this file MINIMAL.
#
# It used to be a full copy of config.yaml, which silently went stale: fixes to dropout,
# word2vec min_count and early-stopping patience never reached the GPU, and two full training
# runs burned on pre-fix hyperparameters. Only list keys that genuinely differ for this machine.
extends: config.yaml

dataset:
  # The A100 is shared. 24000 (graphs x padded nodes) keeps activations ~7 GB, which is fast but
  # still survives a co-tenant grabbing 40+ GB. This does NOT change results: micro-batches are
  # gradient-accumulated up to training.batch_size, preserving the paper's effective 128.
  max_nodes_per_batch: 24000
