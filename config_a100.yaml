project:
  name: devign
  seed: 42
  artifacts_dir: artifacts
  device: cuda
data:
  source: devign_release
  projects:
  - qemu
  - ffmpeg
  raw_dir: data/raw
  processed_dir: data/processed
  hf_cache_dir: null
  max_nodes: 500
  train_split: 0.75
  val_split: 0.125
  test_split: 0.125
  paper_split: false
  split_by: random
  shuffle: true
  imbalanced_vuln_ratio: 0.1
  real_data_path: null
  synthetic:
    enabled: true
    samples_per_project: 600
    vuln_ratio:
      linux_kernel: 0.675
      qemu: 0.425
      wireshark: 0.319
      ffmpeg: 0.509
edge_types:
- AST
- REV_AST
- CFG
- NCS
- DFG_R
- DFG_W
- DFG_C
dataset:
  add_self_loops: false
  normalize_adj: false
  sparse: true
  bucket_by_size: true
  max_nodes_per_batch: 64000
embedding:
  word2vec_dim: 100
  type_dim: 100
  word2vec_min_count: 1
  word2vec_window: 5
  word2vec_epochs: 10
  word2vec_workers: 4
model:
  hidden_dim: 200
  time_steps: 6
  aggregation: sum
  conv:
    conv1_filter:
    - 1
    - 3
    pool1_filter:
    - 1
    - 3
    pool1_stride:
    - 1
    - 2
    conv2_filter:
    - 1
    - 1
    pool2_filter:
    - 2
    - 2
    pool2_stride:
    - 1
    - 2
    conv_channels: 50
    mlp_hidden: 64
  dropout: 0.2
training:
  optimizer: adam
  lr: 0.0001
  batch_size: 128
  epochs: 200
  early_stopping_patience: 100
  l2_weight: 0.0001
  grad_clip: 5.0
baselines:
  bilstm:
    layers: 3
    hidden_dim: 200
    bidirectional: true
    attention: false
  bilstm_att:
    layers: 3
    hidden_dim: 200
    bidirectional: true
    attention: true
  cnn:
    embedding_dim: 100
    num_filters: 100
    filter_sizes:
    - 3
    - 4
    - 5
  metrics_xgboost:
    n_estimators: 200
    max_depth: 6
    bayes_opt_iters: 25
evaluation:
  metrics:
  - accuracy
  - f1
  ablation_edge_types:
  - AST
  - CFG
  - NCS
  - DFG_R
  - DFG_W
  - DFG_C
  static_analyzers:
  - cppcheck
  - flawfinder
  static_analyzer_paths:
    cppcheck: null
    flawfinder: null
  holdout_per_project: 56
